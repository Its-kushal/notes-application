name: privacy_notes
description: "A simple, polished, privacy-first notes application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Encrypted Database & Hardware Key Storage
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0

  # Cryptography (Per-note AES-GCM and PBKDF2)
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # File System, Export & Storage Access Framework
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  path_provider: ^2.1.6

  # Utilities
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
